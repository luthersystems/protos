name: buf-pull-request
# No paths filter: the ci-all gate below is a required check, so every PR
# must start a run. The changes job skips the build job on docs-only PRs.
on: pull_request

permissions:
  contents: read

jobs:
  # Decides whether the build job must run (scripts/ci-changes.sh).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # A pull request checks out the merge commit. Its first parent is the
      # base branch tip, so depth 2 is enough for the diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: ./scripts/ci-changes-test.sh
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
      - uses: bufbuild/buf-lint-action@v1
      - uses: bufbuild/buf-breaking-action@v1
        if: ${{ env.SKIP_BUF_BREAKING != 'true' }}
        with:
          against: "https://github.com/${GITHUB_REPOSITORY}.git#branch=main"
    env:
      SKIP_BUF_BREAKING: true

  # connectorhub/ is outside the root buf module, so the build job above
  # never compiles it. scripts/connectorhub-check.sh builds its protos
  # against buf.lock and checks that go mod tidy (which Dependabot runs)
  # keeps its requires (#49).
  connectorhub:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: connectorhub/go.mod
          cache: false
      - run: ./scripts/connectorhub-check.sh

  # The one check main's ruleset requires for this workflow. always(), so
  # the gate reports on every run: a gate that is skipped (as !cancelled()
  # would leave it on a cancelled run) counts as passing for a required check.
  ci-all:
    name: CI (all required checks)
    if: always()
    needs: [changes, build, connectorhub]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate.
      - name: Fail unless every required job passed
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A required CI job failed, was cancelled or was skipped."
          exit 1
      - name: Every required job passed or was skipped as docs-only
        run: echo "ok"
